[project]
name = "growth-loop-workflow"
version = "0.1.0"
description = "Persistent LangGraph orchestration for the Growth Loop learning workflow"
requires-python = ">=3.11,<3.13"
dependencies = [
  "aiosqlite==0.21.0",
  "fastapi>=0.116,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic-ai-slim[openai]>=1.0,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["growth_loop_workflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

