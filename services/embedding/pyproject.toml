[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "growth-loop-embedding"
version = "0.1.0"
description = "Local BGE-M3 and Qwen3 embedding service for Growth Loop Agent"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=1.26,<3",
  "torch>=2.6,<3",
  "transformers>=4.57,<5",
  "uvicorn[standard]>=0.35,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["growth_loop_embedding"]

