[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "growth-loop-rag-ingestion"
version = "0.1.0"
description = "MinerU and LlamaIndex ingestion adapter for Growth Loop Agent"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "llama-index-core==0.14.24",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["growth_loop_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

